steps:
  # Step 1: Run Maven package to compile the backend code and generate target/*.jar
  - name: 'maven:3.9.16-eclipse-temurin-25'
    entrypoint: 'mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: 'backend'

  # Step 2: Build the Docker image inside the backend context
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cbp-backend/cbp-backend:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cbp-backend/cbp-backend:latest'
      - '.'
    dir: 'backend'

  # Step 3: Push the commit-specific image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cbp-backend/cbp-backend:$COMMIT_SHA'

  # Step 4: Push the 'latest' tagged image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cbp-backend/cbp-backend:latest'

  # Step 5: Deploy the image to Cloud Run service 'cbp-7-backend'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'cbp-7-backend'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cbp-backend/cbp-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=300'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cbp-backend/cbp-backend:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cbp-backend/cbp-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY