spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS identity; CREATE SCHEMA IF NOT EXISTS program; CREATE SCHEMA IF NOT EXISTS platform; CREATE SCHEMA IF NOT EXISTS registration;
  flyway:
    enabled: true
    schemas: identity, program, platform, registration, public
    create-schemas: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: identity
    show-sql: false

# Mock secret keys for jwt and phonepe tests
jwt:
  secret: mock_jwt_signing_secret_key_of_32_bytes_or_more_length
  expiration: 3600000

cors:
  frontend-url: http://localhost:3000
  allowed-origins: http://localhost:3000

frontend:
  payment-status-url: http://localhost:3000/payment-status
  url: http://localhost:3000

phonepe:
  client-id: xxxxx
  client-secret: xxxxx
  client-version: 1
  environment: SANDBOX
  base-url: https://api-preprod.phonepe.com/apis/pg-sandbox
  redirect-url: http://localhost:3000/payment-status
  callback-url: http://localhost:9900/api/v1/payment/phonepe/callback
  callback-username: cbp_user
  callback-password: cbp_pass
  reconciliation-minutes: 15

cbp:
  registration:
    fee: 100

public-registration:
  payment:
    amount: 100
    currency: INR
