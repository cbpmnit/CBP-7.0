server:
  port: ${PORT:9900}

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}}
    username: ${DATABASE_USERNAME:${DB_USERNAME}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS cbp; CREATE SCHEMA IF NOT EXISTS profile; CREATE SCHEMA IF NOT EXISTS payment;
  flyway:
    enabled: true
    schemas: cbp, profile, payment, public
    create-schemas: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: cbp
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

cors:
  frontend-url: ${FRONTEND_URL}

logging:
  level:
    root: INFO

phonepe:
  client-id: ${PHONEPE_CLIENT_ID}
  client-secret: ${PHONEPE_CLIENT_SECRET}
  client-version: ${PHONEPE_CLIENT_VERSION}
  base-url: ${PHONEPE_BASE_URL}
  redirect-url: ${PHONEPE_REDIRECT_URL}
  callback-url: ${PHONEPE_CALLBACK_URL}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}}


