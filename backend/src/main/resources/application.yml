server:
  port: ${PORT:9900}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 6
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS cbp; CREATE SCHEMA IF NOT EXISTS profile; CREATE SCHEMA IF NOT EXISTS payment;
  flyway:
    enabled: true
    schemas: cbp, profile, payment, public
    create-schemas: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: cbp

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  frontend-url: ${FRONTEND_URL}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}

phonepe:
  client-id: ${PHONEPE_CLIENT_ID}
  client-secret: ${PHONEPE_CLIENT_SECRET}
  client-version: ${PHONEPE_CLIENT_VERSION}
  base-url: ${PHONEPE_BASE_URL}
  redirect-url: ${PHONEPE_REDIRECT_URL:${FRONTEND_URL}/payment-status}
  callback-url: ${PHONEPE_CALLBACK_URL:${API_BASE_URL}/api/v1/payment/phonepe/callback}

logging:
  level:
    root: INFO
