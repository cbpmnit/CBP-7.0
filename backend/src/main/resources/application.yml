server:
  port: ${PORT:9900}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS identity; CREATE SCHEMA IF NOT EXISTS program; CREATE SCHEMA IF NOT EXISTS platform;
  flyway:
    enabled: true
    schemas: identity, program, platform, public
    create-schemas: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: identity
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@cbpmnit.in}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  frontend-url: ${FRONTEND_URL}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}

frontend:
  payment-status-url: ${FRONTEND_PAYMENT_STATUS_URL:${FRONTEND_URL}/payment-status}

phonepe:
  client-id: ${PHONEPE_CLIENT_ID}
  client-secret: ${PHONEPE_CLIENT_SECRET}
  client-version: ${PHONEPE_CLIENT_VERSION}
  environment: ${PHONEPE_ENVIRONMENT:SANDBOX}
  base-url: ${PHONEPE_BASE_URL}
  redirect-url: ${PHONEPE_REDIRECT_URL:${FRONTEND_URL}/payment-status}
  callback-url: ${PHONEPE_CALLBACK_URL:${API_BASE_URL}/api/v1/payment/phonepe/callback}
  callback-username: ${PHONEPE_CALLBACK_USERNAME:cbp_user}
  callback-password: ${PHONEPE_CALLBACK_PASSWORD:cbp_pass}
  reconciliation-minutes: ${PHONEPE_RECONCILIATION_MINUTES:15}

certificate:
  minimum-attendance-percentage: 75.0

logging:
  level:
    root: INFO
